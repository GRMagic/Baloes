# Gera o instalador do Windows a cada push na main (ou pelo botão "Run
# workflow" na aba Actions) e o publica na release "instalador", que é sempre
# a do último push. Release, e não artifact: qualquer um baixa sem login, e a
# página (aberta fora do app) acha o instalador por ela para oferecer o botão
# de download. Em repositório público, as máquinas e o armazenamento são
# gratuitos.
name: Gerar instalador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publicar a release

# dois pushes seguidos: só o último publica
concurrency:
  group: instalador
  cancel-in-progress: true

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # só o instalador (o .bat local gera também o portátil); --publish never
      # porque o electron-builder tentaria publicar sozinho ao se ver num CI
      - run: npx electron-builder --win nsis --publish never

      # nome sem acento nem espaço: é o que aparece no link de download
      - name: Publicar na release "instalador"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "dist/*instalador.exe" "Baloes-de-Letras-instalador.exe"
          gh release view instalador *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete instalador --cleanup-tag --yes }
          gh release create instalador "Baloes-de-Letras-instalador.exe" `
            --target "$env:GITHUB_SHA" `
            --title "Instalador para Windows" `
            --notes "Gerado automaticamente a partir do commit $env:GITHUB_SHA." `
            --latest
