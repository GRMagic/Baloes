<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Ícone do app nos tamanhos grandes (48 px para cima): três balões com
       A, B e C, no mesmo estilo dos balões do brinquedo (degradê, brilho no
       alto, sombra embaixo). Os pequenos usam icone-1-balao.svg. -->
  <defs>
    <linearGradient id="amarelo" x1="0.33" y1="0.03" x2="0.67" y2="0.97">
      <stop offset="0" stop-color="hsl(45, 85%, 62%)"/>
      <stop offset="1" stop-color="hsl(38, 80%, 46%)"/>
    </linearGradient>
    <linearGradient id="azul" x1="0.33" y1="0.03" x2="0.67" y2="0.97">
      <stop offset="0" stop-color="hsl(205, 85%, 62%)"/>
      <stop offset="1" stop-color="hsl(215, 80%, 44%)"/>
    </linearGradient>
    <linearGradient id="rosa" x1="0.33" y1="0.03" x2="0.67" y2="0.97">
      <stop offset="0" stop-color="hsl(330, 85%, 64%)"/>
      <stop offset="1" stop-color="hsl(330, 75%, 44%)"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.32" cy="0.26" r="0.42">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra" cx="0.7" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="solta" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <!-- um balão de largura 100, com o nó em (0, 61): x de -50 a 50 -->
    <path id="corpo" d="M0 -61 C68 -61 68 22 0 61 C-68 22 -68 -61 0 -61 Z"/>
  </defs>

  <!-- fios, juntando embaixo -->
  <g fill="none" stroke="#5b6b7a" stroke-width="3" stroke-linecap="round">
    <path d="M70 170 Q 92 205 124 236"/>
    <path d="M128 162 Q 122 200 128 236"/>
    <path d="M186 170 Q 164 205 132 236"/>
  </g>
  <circle cx="128" cy="237" r="4" fill="#5b6b7a"/>

  <!-- balão da esquerda (A) -->
  <g transform="translate(76 100) rotate(-14 0 61)" filter="url(#solta)">
    <use href="#corpo" fill="url(#amarelo)"/>
    <use href="#corpo" fill="url(#sombra)"/>
    <use href="#corpo" fill="url(#brilho)"/>
    <path d="M-7 68 L7 68 L0 59 Z" fill="hsl(38, 80%, 46%)"/>
    <text x="0" y="16" text-anchor="middle" font-family="Comic Sans MS" font-weight="bold" font-size="54" fill="#000" fill-opacity="0.22" dy="3">A</text>
    <text x="0" y="16" text-anchor="middle" font-family="Comic Sans MS" font-weight="bold" font-size="54" fill="#fff">A</text>
  </g>

  <!-- balão da direita (C) -->
  <g transform="translate(180 100) rotate(14 0 61)" filter="url(#solta)">
    <use href="#corpo" fill="url(#rosa)"/>
    <use href="#corpo" fill="url(#sombra)"/>
    <use href="#corpo" fill="url(#brilho)"/>
    <path d="M-7 68 L7 68 L0 59 Z" fill="hsl(330, 75%, 44%)"/>
    <text x="0" y="16" text-anchor="middle" font-family="Comic Sans MS" font-weight="bold" font-size="54" fill="#000" fill-opacity="0.22" dy="3">C</text>
    <text x="0" y="16" text-anchor="middle" font-family="Comic Sans MS" font-weight="bold" font-size="54" fill="#fff">C</text>
  </g>

  <!-- balão do meio (B), na frente e um pouco maior -->
  <g transform="translate(128 88) scale(1.12)" filter="url(#solta)">
    <use href="#corpo" fill="url(#azul)"/>
    <use href="#corpo" fill="url(#sombra)"/>
    <use href="#corpo" fill="url(#brilho)"/>
    <path d="M-7 68 L7 68 L0 59 Z" fill="hsl(215, 80%, 44%)"/>
    <text x="0" y="16" text-anchor="middle" font-family="Comic Sans MS" font-weight="bold" font-size="54" fill="#000" fill-opacity="0.22" dy="3">B</text>
    <text x="0" y="16" text-anchor="middle" font-family="Comic Sans MS" font-weight="bold" font-size="54" fill="#fff">B</text>
  </g>
</svg>
